# 项目任务树 + 任务-知识点映射（拉取式的前提）
#
# 铁律：任务所需知识点由**导师标注**，不由大模型自动生成——
# 这是学分认定与能力追溯的依据，必须可靠。大模型可给候选，教师确认。
# 首批只做 2 个项目，先验证映射粒度是否可用（DEVELOPMENT_PLAN §0.3）。
#
# 任务行格式：代码 | 名称 | 父任务代码 | 里程碑(0/1) | 所需知识点(required) | 有帮助的知识点(helpful)

projects:
