# 项目知识域：不属于培养方案的任何一门课，因此**不折算学分**。
# 一个真实产业项目里总有一部分知识（DMD 结构光、144 孔物料盘编号、
# 这台设备的触发时序）在任何课程大纲里都找不到对应。
# 系统必须如实显示这一部分，而不是硬塞进某门课凑覆盖度——
# 硬凑一次，学分认定的可信度就没了。
project_domains:
  - DAC | DAC-3D 光学检测系统（项目知识域）

# 集中实践环节绑定：项目专有知识的学分载体。
#
# DAC 项目拉取的知识点里有近百个（DMD 结构光、144 孔物料盘编号、这台设备的触发时序）
# 在任何理论课程大纲里都没有。它们不该被硬塞进某门理论课凑覆盖度，
# 但也不该白做——培养方案里本来就有承接它的地方：集中实践环节。
#
# 一个项目只能绑一门实践课，否则同一份工作会在两门课里各认一次学分。
# 格式：项目代码 > 课程代码 | 说明
practice_bindings:
  - PRJ-DAC > G18Z41029 | DAC-3D 是一个完整的在研产业项目，作为专业综合实习的载体

# 课程代码合并：ML 就是培养方案里的「机器学习 G18Z21022」，只是当初用了临时代码。
# **不是删除，是改指向**——这门课底下可能挂着教师写的教学大纲与授课计划，
# 它们不该跟着旧代码一起消失（服务器上就有一份，直接删会撞外键，撞对了）。
merge_courses:
  - ML > G18Z21022
