  - G18Z41025 | 机器学习课程设计 | 集中实践 | 2 | 1.0 | 0 | 考查 | CD-ML
  - G18Z41026 | 深度学习课程设计 | 集中实践 | 2 | 1.0 | 0 | 考查 | CD-DL
  - G18Z41027 | 算法与数据结构课程设计 | 集中实践 | 1 | 1.0 | 0 | 考查 | CD-DSA
  - G18Z41028 | 数据库与向量数据库课程设计 | 集中实践 | 1 | 1.0 | 0 | 考查 | CD-DB
