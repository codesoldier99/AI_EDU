# 人工智能（专升本）人才培养方案 · 院长实验班
#
# 来源：syllabus-project/人工智能（专升本）人才培养方案-- 院长实验班.pdf（2026-07-19 版）
# 课程代码、名称、学期、学分、学时、课程模块均照抄方案原文，未作改动。
#
# ------------------------------------------------------------------
# 这份文件回答的是"培养方案里有哪些课"，**不回答"每门课有哪些知识点"**。
#
# 绝大多数课程在系统里的知识点数是 0，这是**刻意的**，不是没做完：
# 知识图谱按项目拉取建设，没有任何项目拉取过的课，就先不建。
# 一张只有 30 个点但正是项目要用的高数图谱，比一张 300 个点没人拉的完整图谱有用。
# 该建哪门课的哪一部分，由 kp_demand 悬空需求队列回答（make demand）。
#
# 全建完是多少工作量：28 门课 × 200–300 个知识点 ≈ 七千个知识点。
# 那不是一两个学期标得完的量，所以拉取式建设不是"更优雅"，是唯一可行的路径。
# ------------------------------------------------------------------
#
# prefix 字段：该课程的知识点代码前缀。悬空引用靠它归到课名下——
# 教师写 `PROB-NORM` 时，系统知道这是概率论还没建的那个知识点。

program:
  code: AI-ZSB-2026
  name: 人工智能（专升本）· 院长实验班
  level: 专升本
  klass: 院长实验班
  version: "2026"
  total_credit: 0        # 由课程学分汇总得出，不手填
  note: 学制两年；30/70 考核（专业课 30% 笔试 + 70% 实践）；免听不免考

# 课程行格式：代码 | 名称 | 模块 | 学期 | 学分 | 学时 | 考核 | 知识点代码前缀
courses:
  # ---------------------------------------------------------- 学科平台课程
  - G18Z21030 | 高等数学B（上） | 学科平台 | 1 | 4.5 | 72 | 考试 | CALC1
  - G18Z21031 | 高等数学B（下） | 学科平台 | 2 | 4.5 | 72 | 考试 | CALC2
  - G18Z21032 | 线性代数A | 学科平台 | 1 | 3.0 | 48 | 考试 | LA
  - G18Z21033 | 概率论与数理统计A | 学科平台 | 2 | 3.5 | 56 | 考试 | PROB

  # ---------------------------------------------------------- 专业核心课程
  - G18Z21021 | Python语言程序设计 | 专业核心 | 1 | 2.0 | 32 | 考试 | PY
  - G18Z21022 | 机器学习 | 专业核心 | 2 | 3.0 | 48 | 考试 | ML
  - G18Z21023 | 深度学习 | 专业核心 | 2 | 3.0 | 48 | 考试 | DL
  - G18Z21024 | 算法与数据结构 | 专业核心 | 1 | 2.0 | 32 | 考试 | DSA
  - G18Z21025 | 计算机组成原理 | 专业核心 | 1 | 2.0 | 32 | 考试 | COA
  - G18Z21026 | 数据库与向量数据库 | 专业核心 | 1 | 2.0 | 32 | 考试 | DB
  - G18Z21027 | 面向对象程序设计 | 专业核心 | 2 | 2.0 | 32 | 考试 | OOP
  - G18Z21028 | 操作系统 | 专业核心 | 3 | 2.0 | 32 | 考试 | OS
  - G18Z21029 | 计算机网络 | 专业核心 | 3 | 2.0 | 32 | 考试 | NET

  # ---------------------------------------------------------- 专业方向课程（车载具身智能）
  - G18Z32012 | 具身感知与多传感器融合 | 专业方向 | 3 | 3.0 | 48 | 考试 | EPS
  - G18Z32013 | 智能车辆与自动驾驶技术 | 专业方向 | 2 | 3.0 | 48 | 考试 | IV
  - G18Z32014 | 大语言模型与智能体 | 专业方向 | 3 | 4.0 | 64 | 考试 | LLM
  - G18Z32015 | 动力电池原理与构造技术 | 专业方向 | 3 | 2.0 | 32 | 考查 | BAT
  - G18Z32016 | 新能源车辆三电智能控制技术 | 专业方向 | 3 | 2.0 | 32 | 考查 | EV3

  # ---------------------------------------------------------- 集中实践环节
  - G18Z41021 | 具身感知与多传感器融合课程设计 | 集中实践 | 3 | 1.0 | 0 | 考查 | CD-EPS
  - G18Z41022 | 智能车辆与自动驾驶技术课程设计 | 集中实践 | 2 | 1.0 | 0 | 考查 | CD-IV
  - G18Z41023 | 大模型与智能体课程设计 | 集中实践 | 3 | 1.0 | 0 | 考查 | CD-LLM
