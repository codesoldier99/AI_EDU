# 线性代数A（G18Z21032）
#
# 按需求队列建设：DAC 项目的「拟合标定曲线与误差分析」要用矩阵条件数（LA-COND），
# 于是把这门课建到能支撑它的程度——不是把整本教材铺完。
#
# 已有 5 个知识点是从「机器学习第2章」移交过来的（ML-02-01…05），代码保持不变。
# 本文件补齐它们的上下文，使这门课成为一张能独立使用的图。
#
# 行格式：代码 | 名称 | 类型 | 难度 | 能力模块 | 前置知识点 | 一句话说明

course:
  code: G18Z21032
  name: 线性代数A
  credit: 3.0
  term: "1"

units:
  - name: 第1章 行列式与线性方程组
    kps:
      - LA-01-01 | 行列式的定义与性质 | concept | 0.4 | M1 |  | 能用性质化简并计算三阶行列式
      - LA-01-02 | 克拉默法则 | method | 0.4 | M1 | LA-01-01 | 能用行列式判断方程组是否有唯一解
      - LA-01-03 | 高斯消元法 | method | 0.4 | M1,M2 | LA-01-01 | 能把方程组化成行阶梯形并回代求解
      - LA-01-04 | 线性方程组解的结构 | concept | 0.6 | M1 | LA-01-03,ML-02-02 | 能写出通解=特解+齐次解的形式

  - name: 第2章 矩阵及其运算
    kps:
      - LA-02-01 | 初等变换与初等矩阵 | method | 0.4 | M1 | LA-01-03 | 能用初等矩阵表示一次行变换
      - LA-02-02 | 逆矩阵的求法 | method | 0.5 | M1 | LA-02-01,ML-02-02 | 能用初等行变换求逆并说明可逆条件
      - LA-02-03 | 分块矩阵 | method | 0.5 | M1 | ML-02-01 | 能用分块简化大矩阵乘法
      - LA-02-04 | 矩阵的迹及其性质 | concept | 0.4 | M1 | ML-02-01 | 能利用迹的循环性质化简表达式

  - name: 第3章 向量空间
    kps:
      - LA-03-01 | 向量组的线性相关性 | concept | 0.5 | M1 | ML-02-01 | 能判定一组向量是否线性相关
      - LA-03-02 | 极大无关组与向量组的秩 | method | 0.6 | M1 | LA-03-01,ML-02-02 | 能求出极大无关组并表示其余向量
      - LA-03-03 | 基、维数与坐标 | concept | 0.6 | M1 | LA-03-02 | 能在给定基下写出向量的坐标
      - LA-03-04 | 子空间与解空间 | concept | 0.6 | M1 | LA-03-03,LA-01-04 | 能求齐次方程组解空间的一个基

  - name: 第4章 正交性与最小二乘
    kps:
      - LA-04-01 | 内积、长度与正交 | concept | 0.3 | M1 | ML-02-01 | 能计算内积并判断两向量是否正交
      - LA-04-02 | 施密特正交化 | method | 0.5 | M1 | LA-04-01,LA-03-03 | 能把一组基正交单位化
      - LA-04-03 | 正交矩阵及其性质 | concept | 0.5 | M1 | LA-04-02 | 能说明正交变换保持长度与夹角
      - LA-04-04 | 最小二乘的几何解释 | concept | 0.7 | M1,M5 | LA-04-01,LA-01-04 | 能把最小二乘解释成向列空间作投影

  - name: 第5章 特征值与二次型
    kps:
      - LA-05-01 | 相似矩阵与对角化 | method | 0.6 | M1 | ML-02-03 | 能判断矩阵可否对角化并求相似变换
      - LA-05-02 | 实对称矩阵的正交对角化 | method | 0.7 | M1 | LA-05-01,LA-04-03 | 能对实对称矩阵求正交相似对角化
      - LA-05-03 | 二次型与正定性 | concept | 0.7 | M1 | LA-05-02 | 能用顺序主子式判定二次型正定

  - name: 第6章 数值稳定性
    kps:
      - LA-COND | 矩阵条件数与病态方程组 | concept | 0.7 | M1,M5 | LA-02-02,ML-02-05 | 能由条件数判断解对数据扰动有多敏感
      - LA-06-02 | 数据扰动对最小二乘解的影响 | concept | 0.7 | M1,M5 | LA-COND,LA-04-04 | 能解释标定数据噪声为何被条件数放大
