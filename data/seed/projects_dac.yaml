# DAC-3D 产业项目任务树 + 任务-知识点映射
#
# 任务树直接来自 dac-3d_system_v3.0/docs/dac3d-lab-curriculum.md 的六道关卡与验收清单——
# 不是为教学另编一套，而是**把项目本来就要干的活当作任务节点**。
# 每个子任务对应清单里一组可勾选的验收项，因此"完成"是可判定的，不是导师印象分。
#
# 映射里同时出现 DAC-* 与 ML-* 两类代码，这是刻意的：
# 关卡四（AI 之眼）必须拉取机器学习图谱的知识点，关卡三的标定拟合要拉线性回归。
# 学生不需要先修完机器学习——系统在他撞上这一步时才把这几个知识点推给他。
#
# 映射里还出现了一些**尚未建出来的知识点代码**（PROB-ERR、COA-SETUP、EPS-CALIB…）。
# 这不是笔误，是教师在如实标注："这个任务确实要用概率论的测量误差分布，
# 但那门课的图谱我们还没建"。系统把它登记成需求（kp_demand），
# 按被需求次数排序，回答"下一门课先建哪几个点"（make demand）。
# 知识点一旦按该代码建出来，需求自动闭合。前缀含义见 program_ai_zsb.yaml。
#
# 铁律：这份映射是**导师标注**的，模型只能提候选进待审队列（见 packages/agents/kpmatch.py）。
# 任务行格式：代码 | 名称 | 父任务代码 | 里程碑(0/1) | 所需知识点(required) | 有帮助的知识点(helpful)

projects:
  - code: PRJ-DAC
    name: DAC-3D 色散共聚焦光学检测系统
    ptype: optics_inspection
    adapter_key: dac3d
    description: 基于 FPGA 与运动控制卡的产业化光学检测系统，五层架构、软件在环可全程无硬件开发；学生按六道关卡由浅入深参与真实交付。
    tasks:
      # ---------------------------------------------------------- 贯穿项
      - T-DAC-0 | 贯穿项 工程协作与质量 |  | 0 | DAC-10-05,DAC-10-06,DAC-10-07 | DAC-10-04,DAC-10-08

      # ---------------------------------------------------------- 关卡一 软件在环
      - T-DAC-1 | 关卡一 软件在环跑通 |  | 1 | DAC-01-01,DAC-01-07,DAC-02-02 | DAC-01-09
      - T-DAC-1-1 | 环境搭建与首次运行 | T-DAC-1 | 0 | DAC-01-07,DAC-03-07 | DAC-10-04,PY-VENV
      - T-DAC-1-2 | 读懂五层架构 | T-DAC-1 | 0 | DAC-01-01,DAC-01-03,DAC-01-04 | DAC-01-02,DAC-01-10
      - T-DAC-1-3 | 状态机与事件总线通读 | T-DAC-1 | 0 | DAC-02-02,DAC-02-03,DAC-02-05 | DAC-02-06,DAC-02-08
      - T-DAC-1-4 | 给仿真相机注入假瑕疵 | T-DAC-1 | 0 | DAC-03-05,DAC-02-06 | DAC-06-02,DAC-01-08
      - T-DAC-1-5 | 补一个单元测试并跑绿 | T-DAC-1 | 1 | DAC-10-01,DAC-10-02,DAC-02-04 | DAC-10-03,DAC-03-09

      # ---------------------------------------------------------- 关卡二 硬件实战
      - T-DAC-2 | 关卡二 真机接入与首图 |  | 1 | DAC-04-01,DAC-03-10,DAC-06-01 | DAC-04-10
      - T-DAC-2-1 | 硬件认知与安全规程 | T-DAC-2 | 0 | DAC-04-10,DAC-04-01,DAC-02-09 | DAC-04-06
      - T-DAC-2-2 | 设备配置文件解读 | T-DAC-2 | 0 | DAC-03-07,DAC-03-02 | DAC-01-05,DAC-03-01,OOP-IFACE
      - T-DAC-2-3 | 真机回零与点动 | T-DAC-2 | 0 | DAC-04-02,DAC-04-03,DAC-04-05 | DAC-04-09
      - T-DAC-2-4 | 压电 Z 轴聚焦 | T-DAC-2 | 0 | DAC-04-06,DAC-04-07 | DAC-05-01
      - T-DAC-2-5 | 接入相机采到第一张真图 | T-DAC-2 | 1 | DAC-06-01,DAC-06-02,DAC-06-09 | DAC-03-04,DAC-06-08,EPS-CALIB

      # ---------------------------------------------------------- 关卡三 光路之心
      - T-DAC-3 | 关卡三 光路原理与标定 |  | 1 | DAC-05-03,DAC-05-04,DAC-05-10 | DAC-05-11
      - T-DAC-3-1 | 讲清颜色即高度 | T-DAC-3 | 0 | DAC-05-01,DAC-05-02,DAC-05-03 | DAC-05-06
      - T-DAC-3-2 | 说明差动为何更准 | T-DAC-3 | 0 | DAC-05-04 | DAC-05-11
      - T-DAC-3-3 | 参与光路搭建与记录 | T-DAC-3 | 0 | DAC-05-05,DAC-05-07 | DAC-05-06
      - T-DAC-3-4 | 采集波长高度标定数据 | T-DAC-3 | 0 | DAC-05-08,DAC-05-09,EPS-CALIB | DAC-06-07
      - T-DAC-3-5 | 拟合标定曲线与误差分析 | T-DAC-3 | 1 | DAC-05-10,DAC-05-11,ML-05-01,ML-05-02,LA-COND,PROB-ERR | ML-05-04,PROB-CI

      # ---------------------------------------------------------- 关卡四 AI 之眼
      - T-DAC-4 | 关卡四 AI 之眼 缺陷检测 |  | 1 | DAC-07-01,DAC-07-11,DAC-07-12 | DAC-07-10
      - T-DAC-4-1 | 读懂现有传统检测流程 | T-DAC-4 | 0 | DAC-07-02,DAC-07-03,DAC-07-04,DAC-07-05 | DAC-07-06,DSA-GRAPH
      - T-DAC-4-2 | 找出传统算法的失效边界 | T-DAC-4 | 0 | DAC-07-07,DAC-06-08 | DAC-07-03
      - T-DAC-4-3 | 建小数据集并标注 | T-DAC-4 | 0 | DAC-07-08,ML-03-11,ML-03-12 | ML-03-10
      - T-DAC-4-4 | 无泄漏切分训练测试集 | T-DAC-4 | 0 | ML-03-08,ML-04-08 | ML-03-10
      - T-DAC-4-5 | 训练基线分类模型 | T-DAC-4 | 0 | ML-12-08,ML-11-02,ML-10-12 | ML-11-09
      - T-DAC-4-6 | 类别不平衡下的评价 | T-DAC-4 | 0 | DAC-07-09,ML-03-09,ML-04-05 | ML-04-03
      - T-DAC-4-7 | 阈值工程与漏检误检权衡 | T-DAC-4 | 0 | DAC-07-10,ML-04-13 | ML-04-14
      - T-DAC-4-8 | 对比报告与混淆矩阵 | T-DAC-4 | 1 | DAC-07-11,DAC-07-12,ML-04-03 | ML-04-11

      # ---------------------------------------------------------- 关卡五 触发魔法
      - T-DAC-5 | 关卡五 硬件同步触发 |  | 1 | DAC-08-01,DAC-08-07,DAC-08-12 | DAC-08-11
      - T-DAC-5-1 | 讲清软件触发为何抖 | T-DAC-5 | 0 | DAC-08-02,DAC-08-03 | DAC-06-04
      - T-DAC-5-2 | 编码器四倍频 | T-DAC-5 | 0 | DAC-04-04,DAC-08-06,COA-SETUP | DAC-08-05
      - T-DAC-5-3 | PSO 位置同步输出 | T-DAC-5 | 0 | DAC-08-07,DAC-03-03 | DAC-08-10
      - T-DAC-5-4 | 触发延迟补偿 | T-DAC-5 | 0 | DAC-08-08 | DAC-04-09
      - T-DAC-5-5 | SIL 里跑通一次飞拍 | T-DAC-5 | 0 | DAC-08-11,DAC-04-08,DAC-01-08 | DAC-06-06,COA-CDC,EPS-SYNC
      - T-DAC-5-6 | 画出并讲解触发时序图 | T-DAC-5 | 1 | DAC-08-12,DAC-08-03,COA-SETUP | DAC-08-09,EPS-SYNC

      # ---------------------------------------------------------- 关卡六 结业大关
      - T-DAC-6 | 关卡六 结构光与现场交付 |  | 1 | DAC-05-06,DAC-09-07,DAC-10-09 | DAC-10-10
      - T-DAC-6-1 | DMD 图案生成与投影 | T-DAC-6 | 0 | DAC-05-06,DAC-03-02 | DAC-08-09
      - T-DAC-6-2 | 144 孔批次全流程跑通 | T-DAC-6 | 0 | DAC-09-03,DAC-09-01,DAC-04-08 | DAC-02-07
      - T-DAC-6-3 | 批次数据入库与追溯 | T-DAC-6 | 0 | DAC-09-02,DAC-09-04,DAC-09-05,DB-TXN | DAC-09-06,DB-INDEX
      - T-DAC-6-4 | 导出检测报告与合规自查 | T-DAC-6 | 0 | DAC-09-07,DAC-09-08 | ML-14-09
      - T-DAC-6-5 | 结题答辩 | T-DAC-6 | 1 | DAC-10-09,DAC-10-10,ML-05-13 | DAC-10-08
    deps:
      - T-DAC-1 > T-DAC-2
      - T-DAC-2 > T-DAC-3
      - T-DAC-3 > T-DAC-4
      - T-DAC-4 > T-DAC-5
      - T-DAC-5 > T-DAC-6
