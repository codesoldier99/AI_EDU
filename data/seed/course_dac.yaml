# 产业项目课程知识图谱 —— DAC-3D 光电检测系统工程
#
# 这门图谱不是"又一门课"，而是**把一个真实产业项目所需的知识铺成坐标系**。
# 它与 ML 图谱（机器学习原理与应用）共用同一套能力模块 M1–M8，并且**跨课程连边**：
# 例如 DAC-05-10（标定曲线拟合）的前置是 ML-05-01（线性回归模型形式），
# DAC-07-11（学习模型对比实验）的前置是 ML-12-08（预训练与微调）。
#
# 这正是"知识由项目需求拉取，不由课程顺序推送"的落地形态——
# 学生做到楔形片瑕疵分类那一步时，系统沿依赖边把机器学习那几个知识点拉过来，
# 而不是要求他先上完一学期机器学习。
#
# 标注规范同 docs/kp-annotation.md。行格式：
#   代码 | 名称 | 类型 | 难度 | 能力模块 | 前置知识点(逗号分隔，可跨课程) | 一句话说明
# 类型 ∈ concept/method/skill/tool
#
# 来源：dac-3d_system_v3.0 仓库的真实模块（dac3d/、fpga/vivado/src/、ui/）
# 与 docs/dac3d-lab-curriculum.md 的六关卡验收清单。

course:
  code: DAC
  name: DAC-3D 光电检测系统工程
  credit: 4.0
  term: "3"

# 能力模块沿用 ML 图谱同一套（upsert 幂等，重复声明不会产生第二份）
modules:
  - [M1, 数学与建模基础, 用数学语言刻画问题并推导结论的能力]
  - [M2, 编程与工程实现, 把算法写成可运行、可维护代码的能力]
  - [M3, 算法设计与分析, 选择、改造与分析算法复杂度的能力]
  - [M4, 数据处理与特征工程, 获取、清洗、构造特征并评估数据质量的能力]
  - [M5, 模型训练与调优, 训练、诊断与改进模型表现的能力]
  - [M6, 系统集成与部署, 把模型接入真实系统并稳定运行的能力]
  - [M7, 工程质量与协作, 测试、评审、版本与团队协作的能力]
  - [M8, 技术表达与伦理素养, 书面表达、答辩以及数据安全与AI伦理判断力]

