# 数据库与向量数据库（G18Z21026）
#
# 按需求队列建设：DAC 项目的「批次数据入库与追溯」要用事务（DB-TXN）与索引（DB-INDEX）。

course:
  code: G18Z21026
  name: 数据库与向量数据库
  credit: 2.0
  term: "1"

units:
  - name: 第1章 数据模型
    kps:
      - DB-01-01 | 关系模型与三级模式 | concept | 0.3 | M6 |  | 能说出外模式、模式、内模式各自的作用
      - DB-01-02 | 主键、外键与完整性约束 | concept | 0.4 | M6 | DB-01-01 | 能为一组表设计主外键并说明约束的意义
      - DB-01-03 | 实体关系建模 | method | 0.5 | M4,M6 | DB-01-02 | 能把业务需求画成 ER 图并转成表结构
      - DB-01-04 | 范式与反范式的取舍 | concept | 0.6 | M6 | DB-01-03 | 能识别冗余带来的更新异常并判断何时该反范式

  - name: 第2章 SQL
    kps:
      - DB-02-01 | 投影、选择与排序 | skill | 0.3 | M2 | DB-01-01 | 能写出带条件与排序的查询
      - DB-02-02 | 多表连接 | skill | 0.5 | M2,M3 | DB-02-01,DB-01-02 | 能区分内连接与外连接并正确使用
      - DB-02-03 | 聚合与分组 | skill | 0.5 | M2 | DB-02-01 | 能按维度分组统计并用 HAVING 过滤
      - DB-02-04 | 子查询与视图 | skill | 0.6 | M2 | DB-02-02 | 能用子查询表达"每组最大值"这类需求
      - DB-02-05 | 增删改与约束冲突 | skill | 0.4 | M2 | DB-01-02 | 能处理插入时的主键冲突

  - name: 第3章 索引与查询执行
    kps:
      - DB-INDEX | 索引原理与 B+ 树 | concept | 0.6 | M3,M6 | DB-02-01 | 能说明索引为何能把全表扫描变成几次磁盘寻址
      - DB-03-02 | 索引选择与失效场景 | skill | 0.6 | M3,M6 | DB-INDEX | 能指出哪些写法会让索引失效
      - DB-03-03 | 执行计划的解读 | skill | 0.7 | M3,M6 | DB-03-02,DB-02-02 | 能从执行计划看出瓶颈在哪一步

  - name: 第4章 事务与并发
    kps:
      - DB-TXN | 事务与 ACID 特性 | concept | 0.5 | M6 | DB-02-05 | 能说明一批数据为何要整体提交或整体回滚
      - DB-04-02 | 隔离级别与并发异常 | concept | 0.7 | M6 | DB-TXN | 能说出脏读、不可重复读、幻读各自的成因
      - DB-04-03 | 锁与死锁 | concept | 0.7 | M6 | DB-04-02 | 能解释死锁如何产生以及如何避免
      - DB-04-04 | 日志与故障恢复 | concept | 0.7 | M6 | DB-TXN | 能说明断电后未提交的事务如何被回滚

  - name: 第5章 向量数据库
    kps:
      - DB-05-01 | 向量表示与相似度度量 | concept | 0.5 | M1,M4 | ML-02-05 | 能区分余弦相似度与欧氏距离的适用场景
      - DB-05-02 | 近似最近邻检索 | concept | 0.6 | M3 | DB-05-01 | 能说明为何要牺牲精确性换取速度
      - DB-05-03 | 向量索引结构 | concept | 0.7 | M3,M6 | DB-05-02,DB-INDEX | 能说出 HNSW 与倒排量化各自的取舍
      - DB-05-04 | 向量与结构化条件的混合检索 | method | 0.7 | M6 | DB-05-03,DB-02-02 | 能实现"先过滤再向量检索"的查询
      - DB-05-05 | 嵌入版本与重算 | concept | 0.6 | M6,M7 | DB-05-01,ML-03-11 | 能说明换嵌入模型后为何必须重算存量向量

  - name: 第6章 数据工程
    kps:
      - DB-06-01 | 备份、恢复与可追溯 | skill | 0.5 | M6,M7 | DB-04-04 | 能制定一个能真正恢复出数据的备份方案
      - DB-06-02 | 原始数据与派生结果的分离 | concept | 0.6 | M6 | DB-01-04 | 能解释为何判定结果可重算而原始数据不可再生
