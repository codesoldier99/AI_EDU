# 面向对象程序设计（G18Z21027）
#
# 按需求队列建设：DAC 项目的「设备配置文件解读」要用接口与多态（OOP-IFACE）——
# 硬件抽象层 IStage/ICamera 那套设计的本质就是它。

course:
  code: G18Z21027
  name: 面向对象程序设计
  credit: 2.0
  term: "2"

units:
  - name: 第1章 类与对象
    kps:
      - OOP-01-01 | 类与对象的关系 | concept | 0.3 | M2 |  | 能说出类是模板、对象是实例
      - OOP-01-02 | 属性与方法 | skill | 0.3 | M2 | OOP-01-01 | 能定义一个带状态与行为的类
      - OOP-01-03 | 构造与初始化 | skill | 0.4 | M2 | OOP-01-02 | 能保证对象一创建就处于合法状态
      - OOP-01-04 | 封装与访问控制 | concept | 0.4 | M2,M7 | OOP-01-03 | 能说明暴露内部字段为何会让改动变难

  - name: 第2章 继承与多态
    kps:
      - OOP-02-01 | 继承与派生 | concept | 0.4 | M2 | OOP-01-04 | 能用继承复用共同行为
      - OOP-02-02 | 方法重写与动态绑定 | concept | 0.5 | M2 | OOP-02-01 | 能解释调用时到底执行的是哪个版本
      - OOP-IFACE | 接口与多态 | concept | 0.6 | M2,M6 | OOP-02-02 | 能让上层代码只依赖接口而不知道具体实现
      - OOP-02-04 | 抽象类与纯虚方法 | concept | 0.6 | M2 | OOP-IFACE | 能判断该用抽象类还是接口
      - OOP-02-05 | 里氏替换原则 | concept | 0.7 | M2,M7 | OOP-IFACE | 能识别一个"看似继承其实不该继承"的例子
      - OOP-02-06 | 组合优于继承 | concept | 0.7 | M2,M7 | OOP-02-05 | 能把一处深继承改写成组合

  - name: 第3章 设计原则与模式
    kps:
      - OOP-03-01 | 单一职责与开闭原则 | concept | 0.6 | M7 | OOP-01-04 | 能指出一个承担了两种职责的类
      - OOP-03-02 | 依赖倒置与依赖注入 | method | 0.7 | M2,M6 | OOP-IFACE,OOP-03-01 | 能把硬编码的依赖改成从外部注入
      - OOP-03-03 | 工厂与创建型模式 | method | 0.6 | M2,M3 | OOP-03-02 | 能用工厂根据配置创建不同实现
      - OOP-03-04 | 观察者模式与事件解耦 | method | 0.6 | M2,M6 | OOP-IFACE | 能用发布订阅让两个模块互不认识
      - OOP-03-05 | 适配器模式 | method | 0.6 | M2,M6 | OOP-IFACE | 能用适配器接入一个接口不兼容的第三方库

  - name: 第4章 工程实践
    kps:
      - OOP-04-01 | 异常与错误处理 | method | 0.5 | M2,M7 | OOP-01-03 | 能区分该抛异常还是该返回错误码
      - OOP-04-02 | 类型注解与静态检查 | skill | 0.4 | M2,M7 | OOP-01-02 | 能让静态检查在提交前拦下一类错误
      - OOP-04-03 | 可测试性设计 | skill | 0.6 | M7 | OOP-03-02 | 能通过注入替身把外部依赖隔离掉
      - OOP-04-04 | 模块与包的组织 | skill | 0.5 | M2,M7 | OOP-03-01 | 能按职责划分模块并控制依赖方向
      - OOP-04-05 | 重构的时机与手法 | skill | 0.7 | M7 | OOP-02-06,OOP-04-03 | 能在有测试保护的前提下安全重构
      - OOP-04-06 | UML 类图的读写 | skill | 0.4 | M8 | OOP-02-01 | 能用类图向别人讲清一段设计
