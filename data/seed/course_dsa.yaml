# 算法与数据结构（G18Z21024）
#
# 按需求队列建设：DAC 项目的「读懂现有传统检测流程」要用连通域遍历（DSA-GRAPH）——
# 缺陷提取里那步"连通域分析"就是图的遍历。

course:
  code: G18Z21024
  name: 算法与数据结构
  credit: 2.0
  term: "1"

units:
  - name: 第1章 复杂度分析
    kps:
      - DSA-01-01 | 时间复杂度与大O表示 | concept | 0.4 | M3 |  | 能估出一段循环代码的时间复杂度
      - DSA-01-02 | 空间复杂度 | concept | 0.4 | M3 | DSA-01-01 | 能区分原地算法与需要额外空间的算法
      - DSA-01-03 | 最坏、平均与摊还分析 | concept | 0.6 | M3 | DSA-01-01 | 能解释动态数组扩容为何摊还是常数时间

  - name: 第2章 线性结构
    kps:
      - DSA-02-01 | 数组与动态数组 | concept | 0.3 | M2,M3 | DSA-01-02 | 能说出随机访问与插入删除的代价差异
      - DSA-02-02 | 链表 | method | 0.4 | M2,M3 | DSA-02-01 | 能实现单链表的插入与删除
      - DSA-02-03 | 栈及其应用 | method | 0.4 | M3 | DSA-02-01 | 能用栈实现括号匹配或表达式求值
      - DSA-02-04 | 队列与双端队列 | method | 0.4 | M3 | DSA-02-02 | 能用队列实现按层处理
      - DSA-02-05 | 哈希表与冲突处理 | method | 0.6 | M3 | DSA-02-01 | 能说明装填因子与冲突的关系

  - name: 第3章 树结构
    kps:
      - DSA-03-01 | 二叉树与遍历 | method | 0.5 | M3 | DSA-02-03 | 能写出前中后序三种遍历
      - DSA-03-02 | 二叉搜索树 | method | 0.6 | M3 | DSA-03-01 | 能实现查找与插入并分析退化情形
      - DSA-03-03 | 平衡树的基本思想 | concept | 0.7 | M3 | DSA-03-02 | 能说明为何需要旋转来维持平衡
      - DSA-03-04 | 堆与优先队列 | method | 0.6 | M3 | DSA-03-01 | 能用堆实现取最小并分析复杂度

  - name: 第4章 排序与查找
    kps:
      - DSA-04-01 | 简单排序算法 | method | 0.3 | M3 | DSA-01-01 | 能实现插入排序并说明其稳定性
      - DSA-04-02 | 归并排序与分治思想 | method | 0.6 | M3 | DSA-04-01 | 能用分治框架分析归并排序复杂度
      - DSA-04-03 | 快速排序 | method | 0.6 | M3 | DSA-04-02 | 能说明基准选取为何影响最坏情形
      - DSA-04-04 | 二分查找及其边界 | method | 0.5 | M3 | DSA-02-01 | 能正确写出不越界的二分查找

  - name: 第5章 图
    kps:
      - DSA-05-01 | 图的表示方法 | concept | 0.5 | M3 | DSA-02-02 | 能在邻接矩阵与邻接表之间按稀疏度选择
      - DSA-GRAPH | 连通分量与图的遍历 | method | 0.6 | M3 | DSA-05-01,DSA-02-04 | 能用广度优先或深度优先求出所有连通分量
      - DSA-05-03 | 最短路径算法 | method | 0.7 | M3 | DSA-GRAPH,DSA-03-04 | 能实现 Dijkstra 并说明其前提条件
      - DSA-05-04 | 拓扑排序 | method | 0.6 | M3 | DSA-GRAPH | 能对有向无环图求出一个合法的拓扑序

  - name: 第6章 算法设计策略
    kps:
      - DSA-06-01 | 贪心算法 | method | 0.6 | M3 | DSA-04-01 | 能判断一个问题是否具有贪心选择性质
      - DSA-06-02 | 动态规划 | method | 0.7 | M3 | DSA-04-02 | 能写出状态定义与转移方程
      - DSA-06-03 | 递归与回溯 | method | 0.6 | M3 | DSA-03-01 | 能用回溯枚举解空间并剪枝
