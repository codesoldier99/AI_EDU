# 具身感知与多传感器融合（G18Z32012）
#
# 需求队列里欠得最多的一门（欠 2 个知识点、被需求 4 次）：
# DAC 项目的「接入相机采到第一张真图」「采集波长高度标定数据」要用联合标定（EPS-CALIB），
# 「SIL 里跑通一次飞拍」「画出触发时序图」要用时空对齐（EPS-SYNC）。
#
# 这门课与 DAC 项目知识域的分工：
#   本课程讲**通用**的相机模型、标定方法、时空同步原理（换个项目照样用）
#   DAC 域讲**这台设备特有**的色散共聚焦光路、DMD、144 孔物料盘（换个项目就没用了）
# 前者能折算学分，后者走集中实践环节。

course:
  code: G18Z32012
  name: 具身感知与多传感器融合
  credit: 3.0
  term: "3"

units:
  - name: 第1章 传感器与感知任务
    kps:
      - EPS-01-01 | 感知任务的定义与评价指标 | concept | 0.4 | M4 |  | 能把一个感知需求写成可测量的指标
      - EPS-01-02 | 常见传感器的物理量与局限 | concept | 0.3 | M6 | EPS-01-01 | 能说出相机、激光、IMU 各自测什么、怕什么
      - EPS-01-03 | 采样率、量程与分辨率 | concept | 0.4 | M1,M6 | EPS-01-02 | 能依据被测对象选定采样率与量程
      - EPS-01-04 | 传感器噪声模型 | concept | 0.5 | M1,M4 | EPS-01-03,ML-02-13 | 能用均值与方差刻画一路传感器的噪声

  - name: 第2章 相机成像与几何
    kps:
      - EPS-02-01 | 针孔相机模型 | concept | 0.5 | M1 | EPS-01-02 | 能写出针孔投影关系并说明焦距的作用
      - EPS-02-02 | 内参矩阵与镜头畸变 | concept | 0.6 | M1 | EPS-02-01,ML-02-01 | 能说出内参各元素含义并识别桶形畸变
      - EPS-02-03 | 刚体变换与外参 | method | 0.6 | M1 | ML-02-01,LA-04-03 | 能用旋转矩阵与平移向量表示位姿
      - EPS-02-04 | 齐次坐标与坐标系链 | method | 0.6 | M1 | EPS-02-03 | 能把多级坐标变换串成一个矩阵连乘
      - EPS-02-05 | 像素当量与视场计算 | skill | 0.4 | M1,M6 | EPS-02-02 | 能算出一个像素代表多少毫米

  - name: 第3章 标定
    kps:
      - EPS-03-01 | 标定的目的与误差来源 | concept | 0.4 | M4 | EPS-02-02 | 能说清不标定会带来哪种系统性偏差
      - EPS-03-02 | 标定板与角点提取 | skill | 0.4 | M2,M4 | EPS-03-01 | 能采集一组合格的标定图像
      - EPS-03-03 | 内参标定流程 | skill | 0.6 | M4,M6 | EPS-03-02,EPS-02-02 | 能完整跑通一次内参标定并读懂重投影误差
      - EPS-CALIB | 多传感器联合标定与外参求解 | method | 0.7 | M1,M6 | EPS-03-03,EPS-02-04,LA-04-04 | 能求出两个传感器之间的外参并给出残差
      - EPS-03-05 | 标定结果的验证与残差判读 | skill | 0.6 | M4,M5 | EPS-CALIB,PROB-05-02 | 能从残差分布判断标定是否可信

  - name: 第4章 时空同步
    kps:
      - EPS-04-01 | 时间戳与时钟源 | concept | 0.4 | M6 | EPS-01-03 | 能说出各路数据的时间戳打在哪一环
      - EPS-04-02 | 硬件触发与软件对齐的取舍 | concept | 0.5 | M6 | EPS-04-01 | 能判断什么场景必须上硬触发
      - EPS-SYNC | 多传感器时空对齐 | method | 0.7 | M1,M6 | EPS-04-02,EPS-02-04 | 能把不同频率、不同坐标系的数据对到同一时空基准
      - EPS-04-04 | 延迟标定与时间偏移估计 | method | 0.7 | M1,M6 | EPS-SYNC | 能估计并补偿两路数据之间的固定延迟

  - name: 第5章 融合方法
    kps:
      - EPS-05-01 | 融合层次：数据级/特征级/决策级 | concept | 0.5 | M6 | EPS-SYNC | 能针对任务选择合适的融合层次
      - EPS-05-02 | 加权融合与协方差 | method | 0.6 | M1,M5 | EPS-01-04,ML-02-13 | 能按不确定度给各路数据定权
      - EPS-05-03 | 卡尔曼滤波的基本思想 | concept | 0.7 | M1,M3 | EPS-05-02,PROB-02-05 | 能说清预测与更新两步各做什么
      - EPS-05-04 | 融合失效的检测 | skill | 0.7 | M5,M6 | EPS-05-02 | 能识别某一路失效并及时降级

  - name: 第6章 感知系统工程
    kps:
      - EPS-06-01 | 感知系统的评测方法 | skill | 0.6 | M5 | EPS-01-01,EPS-03-05 | 能设计一组能复现的评测实验
      - EPS-06-02 | 标定与感知数据的管理 | skill | 0.5 | M4,M7 | EPS-03-05,ML-03-11 | 能让三个月后的人复现同一次标定
