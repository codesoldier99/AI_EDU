# 起始题库（教师录入，origin=teacher，入库即已审）
#
# 这份文件的作用不是"把题出全"，而是把**题该长什么样**定下来：
#   · 一道题只考一个知识点；
#   · 干扰项对应真实的想错方式，不是随手编三个错的；
#   · 解析要写清每个错误选项错在哪一步——这段解析将来会进错误模式库。
# 模型出的题一律进待审队列，教师在「题库与技能包」页面确认后才会发给学生。
#
# 行格式：
#   kp:        知识点代码
#   type:      choice | numeric | short
#   stem:      题面
#   options:   选项（choice）
#   answer:    选项字母 / 可计算表达式 / 参考答案
#   tolerance: 相对误差（numeric）
#   keywords:  判分关键词，"甲|乙" 表示同义任一命中（short）
#   rationale: 解析

questions:
  - kp: ML-01-04
    type: choice
    difficulty: 0.3
    stem: 某同学用测试集反复调超参，最终报告测试集准确率 96%。这个数字的主要问题是什么？
    options:
      - A. 准确率指标本身不适合分类任务
      - B. 测试集已被反复使用，它估计的不再是泛化性能
      - C. 训练集太小，96% 不可信
      - D. 应当改用交叉熵而不是准确率
    answer: B
    rationale: >
      测试集只能用一次。反复在测试集上选超参，等于把测试集变成了第二个验证集，
      它给出的估计会系统性偏乐观。选 A 混淆了指标选择与数据划分；选 C 把问题
      归到样本量上，但即使样本量足够，重复使用测试集的问题依然存在；
      选 D 同样答非所问。

  - kp: ML-01-06
    type: choice
    difficulty: 0.4
    stem: 训练损失持续下降、验证损失先降后升。此时最先该做的是什么？
    options:
      - A. 继续训练，等验证损失自己降回来
      - B. 加大模型容量
      - C. 在验证损失最低点早停，并加入正则或更多数据
      - D. 把验证集并入训练集以提高数据量
    answer: C
    rationale: >
      这是过拟合的典型曲线形态。选 A 误判为欠拟合；选 B 会让过拟合更严重；
      选 D 直接毁掉了验证集的作用，是本课程明确禁止的做法。

  - kp: ML-01-05
    type: short
    difficulty: 0.4
    stem: 用两句话说明为什么经验误差低不能推出泛化误差低。
    answer: 经验误差只在见过的样本上度量，模型可能记住了训练样本的噪声；泛化误差衡量的是未见样本上的表现，两者只有在样本充分且模型容量受控时才接近。
    keywords:
      - 经验误差|训练误差
      - 泛化
      - 未见|没见过|新样本
      - 过拟合|记住|噪声
    rationale: >
      要点有二：度量的对象不同（见过 vs 未见），以及模型有能力记住噪声。
      只答"会过拟合"而不说清度量对象不同的，判为部分命中，进人工队列。

  - kp: ML-02-01
    type: numeric
    difficulty: 0.3
    stem: A 是 3×4 矩阵，B 是 4×5 矩阵。矩阵乘积 AB 共有多少个元素？
    answer: 3*5
    tolerance: 0.0
    rationale: >
      乘积形状由外侧维度决定，为 3×5，共 15 个元素。答 20 的通常是把内侧
      维度（4）当成了结果维度，这正是维度合法性没判清的典型表现。

  - kp: ML-01-03
    type: choice
    difficulty: 0.2
    stem: 预测明天某路口 6 时至 7 时的车流量（辆/小时）。这属于哪类任务，评价指标该选哪一族？
    options:
      - A. 分类任务，用准确率与 F1
      - B. 回归任务，用 MAE/RMSE 一族
      - C. 聚类任务，用轮廓系数
      - D. 排序任务，用 NDCG
    answer: B
    rationale: >
      输出空间是连续的计数值，属回归。选 A 是把"离散取值"误当成"类别"——
      车流量虽然取整数，但相邻取值之间有大小关系，用准确率会丢掉这层信息。

  # 以下几个知识点在演示班级里最常成为练习目标（根因点或任务缺口），先把题补上。
  # 挑选依据不是"重要"，而是 `make practice` 报出来的题库缺口——
  # 让教师的出题精力花在真正挡路的地方，这正是覆盖缺口清单的用处。

  - kp: ML-01-01
    type: choice
    difficulty: 0.2
    stem: 把"用最小二乘法拟合一条直线来预测房价"按机器学习三要素拆开，"最小二乘"属于哪一要素？
    options:
      - A. 模型
      - B. 策略
      - C. 算法
      - D. 数据
    answer: B
    rationale: >
      三要素是"模型—策略—算法"：模型是假设空间（这里是所有直线），
      策略是评价好坏的准则（这里是平方损失最小），算法是求解策略的具体手段
      （这里可以是正规方程或梯度下降）。把"最小二乘"答成算法，是最常见的一种混淆——
      它说的是**用什么标准判定好坏**，不是**怎么把它算出来**。

  - kp: ML-01-02
    type: choice
    difficulty: 0.2
    stem: 某项目有 10 万张路口监控图，其中 800 张标了"是否拥堵"。只用这 800 张训练一个拥堵判别器，属于哪类任务？
    options:
      - A. 无监督学习，因为绝大多数数据没有标注
      - B. 监督学习，判定依据是训练时用没用到标注
      - C. 强化学习，因为要在真实路口决策
      - D. 半监督学习，且必须用满 10 万张
    answer: B
    rationale: >
      判定依据是**训练时是否使用了标注**，不是"标注占比高不高"。
      选 A 把数据规模当成了判定标准；选 D 混淆了"可以用"与"必须用"——
      不动用那 9.92 万张无标注数据时，它就是标准的监督学习。

  - kp: ML-01-10
    type: short
    difficulty: 0.3
    stem: 按顺序写出机器学习项目从问题定义到上线之后的主要环节，并说明为什么"上线"不是最后一步。
    answer: 问题定义→数据采集与标注→数据清洗与特征→模型选择与训练→评估与调优→部署上线→线上监控与迭代；上线后数据分布会漂移、指标会退化，必须持续监控并回流数据重训，否则模型会慢慢失效。
    keywords:
      - 问题定义|需求
      - 数据|采集|标注
      - 训练
      - 评估|调优
      - 部署|上线
      - 监控|漂移|迭代
    rationale: >
      环节顺序本身不难，难在最后一句：**上线是循环的开始，不是终点**。
      只写到"部署上线"就收尾的，恰恰是把模型当一次性交付物看的那种理解，
      在真实项目里代价最大。

  - kp: ML-03-01
    type: choice
    difficulty: 0.4
    stem: 团队用工作日 8:00–9:00 采集的路口视频训练拥堵识别模型，线上全天运行后夜间误报很多。最贴切的诊断是什么？
    options:
      - A. 模型容量不足，应换更深的网络
      - B. 采集时段导致抽样偏差，训练分布覆盖不到夜间场景
      - C. 学习率过大，训练没有收敛
      - D. 测试集划分比例不对
    answer: B
    rationale: >
      症状是"某一类场景系统性出错"，而不是"整体都差"——这是分布问题不是拟合问题。
      选 A、C 是把数据问题当成模型问题，换更深的网络只会把训练分布拟合得更死；
      选 D 与"夜间"这个特定条件对不上。

  - kp: ML-05-11
    type: choice
    difficulty: 0.4
    stem: 二维平面上四个点：(0,0) 与 (1,1) 为正类，(0,1) 与 (1,0) 为负类。单个不带隐藏层的线性分类器能否把它们分开？
    options:
      - A. 能，只要学习率调得够小
      - B. 能，换成 sigmoid 输出即可
      - C. 不能，这四个点线性不可分
      - D. 不能，但增加训练轮数可以解决
    answer: C
    rationale: >
      这是异或（XOR）的经典构造，两类点在二维平面上无法用一条直线分开。
      选 A、D 把"线性不可分"误当成"没训够"——训练再久也不会出现这条不存在的直线；
      选 B 忽略了 sigmoid 只是把线性输出压到 (0,1)，决策边界仍然是直线。

  - kp: ML-10-02
    type: numeric
    difficulty: 0.4
    stem: 一个三层全连接网络，输入 64 维、隐藏层 32 个神经元、输出 10 类，每层都带偏置。总参数量是多少？
    answer: 64*32+32+32*10+10
    tolerance: 0.0
    rationale: >
      逐层算：第一层权重 64×32=2048 加偏置 32；第二层权重 32×10=320 加偏置 10，
      合计 2410。常见的错是漏掉偏置（得 2368），或把两层的输入维度弄反。

  - kp: ML-13-01
    type: short
    difficulty: 0.5
    stem: 训练脚本里做了一次特征归一化，推理服务里没有。会出什么问题？该怎么改？
    answer: 训练与推理的预处理不一致会造成训练服务偏斜，线上输入分布与训练时不同，精度骤降；应把预处理与模型打包成同一个产物，训练和推理调用同一份代码，并用同一份统计量。
    keywords:
      - 不一致|偏斜|不同
      - 预处理|归一化
      - 精度|下降|骤降
      - 同一|打包|一起|复用
    rationale: >
      这是最贵也最常见的一类线上事故：模型本身没问题，喂进去的数据变了。
      答案必须落到"同一份预处理代码 + 同一份统计量"这个具体做法上，
      只说"要保持一致"而没说怎么保证的，判为部分命中。
