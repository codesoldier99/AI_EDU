# 计算机组成原理（G18Z21025）
#
# 需求队列第二位（欠 2 个知识点、被需求 3 次）：
# DAC 项目的「编码器四倍频」「画出触发时序图」要用建立/保持时间（COA-SETUP），
# 「SIL 里跑通一次飞拍」要用跨时钟域（COA-CDC）。
#
# 与 DAC 域的分工：本课程讲通用的时序逻辑与总线原理，
# DAC 域讲这台设备特有的 PSO 触发核与寄存器布局。

course:
  code: G18Z21025
  name: 计算机组成原理
  credit: 2.0
  term: "1"

units:
  - name: 第1章 数据表示
    kps:
      - COA-01-01 | 二进制与十六进制转换 | method | 0.2 | M1,M2 |  | 能在二、十、十六进制间正确换算
      - COA-01-02 | 补码表示与溢出判定 | method | 0.4 | M1 | COA-01-01 | 能用补码做加减并判断是否溢出
      - COA-01-03 | 浮点数表示与精度损失 | concept | 0.6 | M1 | COA-01-02 | 能解释 0.1+0.2≠0.3 的原因
      - COA-01-04 | 字节序与数据对齐 | concept | 0.4 | M2,M6 | COA-01-01 | 能说明跨设备传数据时字节序为何要约定

  - name: 第2章 数字逻辑与时序
    kps:
      - COA-02-01 | 逻辑门与真值表 | concept | 0.2 | M1 |  | 能由真值表写出逻辑表达式
      - COA-02-02 | 组合逻辑电路设计 | method | 0.4 | M1,M3 | COA-02-01 | 能设计一个多路选择器或译码器
      - COA-02-03 | 触发器与寄存器 | concept | 0.5 | M2,M6 | COA-02-02 | 能说明触发器如何在时钟沿保存状态
      - COA-02-04 | 时序逻辑与有限状态机 | method | 0.6 | M3,M6 | COA-02-03 | 能把一个控制流程画成状态转换图并实现
      - COA-02-05 | 时钟、周期与频率 | concept | 0.3 | M1,M6 | COA-02-03 | 能由时钟频率算出一个周期多少纳秒
      - COA-SETUP | 建立时间与保持时间 | concept | 0.7 | M1,M6 | COA-02-05,COA-02-03 | 能解释违反建立时间为何会采到错误数据
      - COA-CDC | 跨时钟域与亚稳态 | concept | 0.7 | M6 | COA-SETUP | 能说明为何跨时钟域必须加同步器

  - name: 第3章 处理器
    kps:
      - COA-03-01 | 指令集与寻址方式 | concept | 0.5 | M2,M3 | COA-01-02 | 能读懂一条指令的操作码与操作数
      - COA-03-02 | 数据通路与控制器 | concept | 0.6 | M3,M6 | COA-03-01,COA-02-04 | 能画出一条指令在数据通路上的走向
      - COA-03-03 | 流水线与冒险 | concept | 0.7 | M3 | COA-03-02 | 能识别数据冒险并说明气泡的代价
      - COA-03-04 | 中断与异常 | concept | 0.6 | M6 | COA-03-02 | 能说清中断响应的完整过程

  - name: 第4章 存储层次
    kps:
      - COA-04-01 | 存储层次与局部性原理 | concept | 0.4 | M6 |  | 能解释为何加一级缓存能显著提速
      - COA-04-02 | Cache 原理与命中率 | method | 0.6 | M3,M6 | COA-04-01 | 能计算命中率并说明映射方式的影响
      - COA-04-03 | 主存组织与地址映射 | concept | 0.5 | M6 | COA-04-01 | 能把逻辑地址翻译成物理地址
      - COA-04-04 | DMA 与数据搬运 | concept | 0.6 | M6 | COA-04-03,COA-03-04 | 能说明 DMA 为何能把 CPU 解放出来

  - name: 第5章 总线与接口
    kps:
      - COA-05-01 | 总线协议与仲裁 | concept | 0.5 | M6 | COA-02-05 | 能说清多个主设备如何争用一条总线
      - COA-05-02 | 寄存器映射与内存映射 IO | skill | 0.6 | M2,M6 | COA-04-03,COA-05-01 | 能通过读写寄存器配置一个外设
      - COA-05-03 | IO 时序与握手 | concept | 0.6 | M6 | COA-SETUP,COA-05-01 | 能读懂一张接口时序图上的握手信号
      - COA-05-04 | 实时性与确定性延迟 | concept | 0.7 | M6 | COA-03-04,COA-05-03 | 能解释为何操作系统调度会引入不确定抖动
