# 概率论与数理统计A（G18Z21033）
#
# 按需求队列建设：DAC 项目的「拟合标定曲线与误差分析」要用测量误差的正态性
# （PROB-ERR）与置信区间（PROB-CI），于是把这门课建到能支撑它的程度。
#
# 已有 5 个知识点从「机器学习第2章」移交而来（ML-02-11…15），代码保持不变。

course:
  code: G18Z21033
  name: 概率论与数理统计A
  credit: 3.5
  term: "2"

units:
  - name: 第1章 随机事件与概率
    kps:
      - PROB-01-01 | 样本空间与事件运算 | concept | 0.3 | M1 |  | 能写出样本空间并对事件做交并补运算
      - PROB-01-02 | 古典概型与几何概型 | method | 0.3 | M1 | PROB-01-01 | 能用等可能性计算简单事件概率
      - PROB-01-03 | 全概率公式与分解 | method | 0.5 | M1 | ML-02-11 | 能按完备事件组分解复杂事件的概率

  - name: 第2章 随机变量及其分布
    kps:
      - PROB-02-01 | 离散型随机变量与分布律 | concept | 0.3 | M1 | PROB-01-01 | 能写出分布律并验证归一性
      - PROB-02-02 | 分布函数 | concept | 0.4 | M1 | PROB-02-01 | 能由分布律或密度求分布函数
      - PROB-02-03 | 连续型随机变量与概率密度 | concept | 0.4 | M1 | PROB-02-02 | 能由密度函数求区间概率
      - PROB-02-04 | 二项分布与泊松分布 | method | 0.4 | M1 | PROB-02-01 | 能识别适用场景并计算概率
      - PROB-02-05 | 正态分布及其标准化 | method | 0.4 | M1 | PROB-02-03 | 能查标准正态表求任意正态分布的概率
      - PROB-02-06 | 随机变量函数的分布 | method | 0.6 | M1 | PROB-02-03 | 能求 Y=g(X) 的分布

  - name: 第3章 多维随机变量与极限定理
    kps:
      - PROB-03-01 | 二维随机变量与边缘分布 | concept | 0.5 | M1 | PROB-02-03 | 能由联合分布求边缘分布
      - PROB-03-02 | 独立性与相关系数 | concept | 0.5 | M1 | PROB-03-01,ML-02-13 | 能区分不相关与相互独立
      - PROB-03-03 | 大数定律 | concept | 0.6 | M1 | ML-02-13 | 能说明为何样本均值会稳定到期望
      - PROB-03-04 | 中心极限定理 | concept | 0.6 | M1 | PROB-03-03,PROB-02-05 | 能解释多个独立误差叠加为何近似正态

  - name: 第4章 统计推断
    kps:
      - PROB-04-01 | 总体、样本与统计量 | concept | 0.3 | M1,M4 | PROB-02-01 | 能区分总体参数与样本统计量
      - PROB-04-02 | 常用抽样分布 | concept | 0.6 | M1 | PROB-04-01,PROB-02-05 | 能说出卡方、t、F 分布的来源
      - PROB-04-03 | 点估计的无偏性与有效性 | concept | 0.6 | M1 | PROB-04-01,ML-02-14 | 能判断一个估计量是否无偏
      - PROB-CI | 区间估计与置信区间 | method | 0.6 | M1,M5 | PROB-04-02,PROB-04-03 | 能给出均值的置信区间并正确解读其含义
      - PROB-04-05 | 假设检验的基本思想 | concept | 0.6 | M1 | PROB-CI | 能提出原假设并说明拒绝域的含义
      - PROB-04-06 | 两类错误与显著性水平 | concept | 0.7 | M1,M8 | PROB-04-05 | 能解释显著不等于重要

  - name: 第5章 测量误差与不确定度
    kps:
      - PROB-ERR | 测量误差的正态性与重复性 | concept | 0.6 | M1,M4 | PROB-03-04,PROB-02-05 | 能说明重复测量误差为何近似正态并估计其标准差
      - PROB-05-02 | 系统误差与随机误差的区分 | concept | 0.5 | M1,M4 | PROB-ERR | 能从残差图上区分两类误差
      - PROB-05-03 | 误差传播与合成不确定度 | method | 0.7 | M1 | PROB-ERR,ML-02-13 | 能把各分量不确定度合成为总不确定度
