# =====================================================================
# 2026 级人工智能专升本 · 院长实验班入学选拔考
#
# 双重身份（docs/measurement-plan.md §4）：
#   A 部分 概念锚题 40 分 —— 两年内反复重测，**考后不讲评、不返还、不公布答案**
#   B 部分 选拔专用 60 分 —— 一次性使用，考后可以公开讲评
# 分数线切在 A+B 总分上；只有 A 部分参与两年后的纵向比较。
#
# 自学范围（考前 1 周）：
#   周志华《机器学习》第 1 章 绪论、第 2 章 模型评估与选择
#   李沐等《动手学深度学习》第 2 章 预备知识（官方免费中文版 zh-v2.d2l.ai）
#
# 命题约束（measurement-plan §4.1）：
#   题量大、分值碎（50 题 / 100 分 / 单题 1–5 分），使总分取值足够密集；
#   程序题总分压到 10 分，避免一道主观题的判分波动把分数线附近的人洗牌。
# =====================================================================

exam:
  code: ML-SELECT-2026
  title: 2026 级人工智能专升本 · 院长实验班选拔考试
  duration_min: 60
  shuffle: 1
  note: >
    A 部分为概念锚题，考后不讲评、不返还。B 部分考后公开讲评。
    并列裁决顺序：总分 → A 部分得分 → 程序题得分 → 交卷时间。

items:

# ---------------------------------------------------------------------
# A 部分 · 概念锚题（40 分）  单选 15×2 + 判断 10×1
# 干扰项一律来自真实的想错方式，不是随手编的（skills/quiz-distractor-design.md）
# ---------------------------------------------------------------------

  - {part: A, type: single, points: 2, difficulty: 0.25, kp: ML-01-01,
     stem: "用最小二乘法拟合直线预测房价。按「模型—策略—算法」三要素，「最小二乘」属于哪一要素？",
     options: ["A. 模型", "B. 策略", "C. 算法", "D. 数据"],
     answer: B,
     rationale: "模型是假设空间（所有直线），策略是评价好坏的准则（平方损失最小），算法是求解手段（正规方程或梯度下降）。把最小二乘答成算法，是把「用什么标准判好坏」和「怎么算出来」混为一谈。"}

  - {part: A, type: single, points: 2, difficulty: 0.3, kp: ML-01-02,
     stem: "某项目有 10 万张监控图，其中 800 张标注了「是否拥堵」。只用这 800 张训练判别器，属于哪类学习？",
     options: ["A. 无监督学习，因为绝大多数数据没有标注", "B. 监督学习，判定依据是训练时是否使用了标注", "C. 强化学习，因为要在真实路口决策", "D. 半监督学习，且必须用满 10 万张"],
     answer: B,
     rationale: "判定依据是训练时是否使用标注，不是标注占比。选 A 把数据规模当判定标准；选 D 混淆了「可以用」与「必须用」。"}

  - {part: A, type: single, points: 2, difficulty: 0.25, kp: ML-01-03,
     stem: "预测某路口下一小时车流量（辆/小时）。任务类型与指标族应选？",
     options: ["A. 分类任务，用准确率与 F1", "B. 回归任务，用 MAE/RMSE 一族", "C. 聚类任务，用轮廓系数", "D. 排序任务，用 NDCG"],
     answer: B,
     rationale: "输出空间连续，属回归。车流量虽取整数，但相邻取值之间有大小关系，用准确率会丢掉这层信息。"}

  - {part: A, type: single, points: 2, difficulty: 0.45, kp: ML-01-04,
     stem: "某同学用测试集反复调超参，最终报告测试集准确率 96%。这个数字的主要问题是？",
     options: ["A. 准确率指标不适合分类任务", "B. 测试集已被反复使用，它估计的不再是泛化性能", "C. 训练集太小，96% 不可信", "D. 应改用交叉熵而非准确率"],
     answer: B,
     rationale: "测试集只能用一次。反复在测试集上选超参等于把它变成第二个验证集，估计会系统性偏乐观。"}

  - {part: A, type: single, points: 2, difficulty: 0.4, kp: ML-01-05,
     stem: "关于经验误差与泛化误差，下列说法正确的是？",
     options: ["A. 经验误差越小，泛化误差一定越小", "B. 经验误差在训练样本上度量，泛化误差在未见样本上度量，前者小不能推出后者小", "C. 训练误差为 0 说明模型已经找到真实规律", "D. 泛化误差可以在训练集上直接算出来"],
     answer: B,
     rationale: "两者度量的对象不同，且模型有能力记住训练样本的噪声。C 恰恰是过拟合的典型征兆；D 混淆了「可估计」与「可直接计算」。"}

  - {part: A, type: single, points: 2, difficulty: 0.4, kp: ML-01-06,
     stem: "训练损失持续下降、验证损失先降后升。此时最先应做什么？",
     options: ["A. 继续训练，等验证损失自己降回来", "B. 加大模型容量", "C. 在验证损失最低点早停，并加入正则或补充数据", "D. 把验证集并入训练集以增加数据量"],
     answer: C,
     rationale: "这是过拟合的典型曲线。A 误判为欠拟合；B 会加重过拟合；D 直接毁掉验证集的作用。"}

  - {part: A, type: single, points: 2, difficulty: 0.55, kp: ML-01-08,
     stem: "「没有免费的午餐」（NFL）定理说明了什么？",
     options: ["A. 任何算法都需要付出计算代价", "B. 在所有可能问题上平均，任意两个算法的期望性能相同，因此脱离具体问题谈「哪个算法更好」没有意义", "C. 深度学习一定优于传统机器学习", "D. 数据越多模型一定越好"],
     answer: B,
     rationale: "NFL 的前提是「所有问题等可能出现」。它的实际意义是：算法优劣必须相对于具体问题与归纳偏好来谈。"}

  - {part: A, type: single, points: 2, difficulty: 0.5, kp: ML-01-07,
     stem: "一个模型在训练集与验证集上表现都很差，且两者差距很小。按偏差-方差分解，最可能的情况是？",
     options: ["A. 高偏差（欠拟合）", "B. 高方差（过拟合）", "C. 噪声过大，无法改善", "D. 数据泄漏"],
     answer: A,
     rationale: "两者都差且差距小 = 模型本身拟合能力不足，属高偏差。高方差的典型形态是训练好、验证差、差距大。"}

  - {part: A, type: single, points: 2, difficulty: 0.4, kp: ML-04-07,
     stem: "10 折交叉验证中，「10」指的是？",
     options: ["A. 训练 10 个不同的模型结构", "B. 把数据分成 10 份，轮流用 9 份训练、1 份验证，共训练 10 次", "C. 训练轮数为 10", "D. 保留 10% 作为测试集"],
     answer: B,
     rationale: "k 折是对数据的划分次数，不是模型数量、训练轮数或留出比例。"}

  - {part: A, type: single, points: 2, difficulty: 0.5, kp: ML-04-01,
     stem: "二分类中，把实际为负、被预测为正的样本称为？",
     options: ["A. 真正例 TP", "B. 假正例 FP", "C. 真反例 TN", "D. 假反例 FN"],
     answer: B,
     rationale: "命名规则是「预测对不对 + 预测成了什么」：预测成正例但预测错了，即假正例。"}

  - {part: A, type: single, points: 2, difficulty: 0.55, kp: ML-04-03,
     stem: "某疾病筛查模型：100 个真实病人中查出 80 个；共报告 200 例阳性。其查全率（召回率）与查准率分别是？",
     options: ["A. 40% 与 80%", "B. 80% 与 40%", "C. 80% 与 80%", "D. 40% 与 40%"],
     answer: B,
     rationale: "查全率 = 80/100 = 80%（真病人被查出的比例）；查准率 = 80/200 = 40%（报告为阳性中真病人的比例）。把两者记反是最常见的错误。"}

  - {part: A, type: single, points: 2, difficulty: 0.5, kp: ML-04-03,
     stem: "在正例极少的不平衡数据上（正例占 2%），为什么准确率不适合作为主指标？",
     options: ["A. 准确率无法计算", "B. 全预测为负例即可得到 98% 准确率，该数字与模型是否有用无关", "C. 准确率只适用于回归任务", "D. 准确率会随样本量变化"],
     answer: B,
     rationale: "不平衡数据上准确率被多数类主导。应看查准率/查全率/F1 或 PR 曲线。"}

  - {part: A, type: single, points: 2, difficulty: 0.6, kp: ML-04-04,
     stem: "关于 ROC 曲线与 AUC，下列说法正确的是？",
     options: ["A. AUC = 0.5 表示模型完美", "B. ROC 的横纵轴分别是查准率与查全率", "C. AUC 可理解为「随机取一正一负样本，模型给正样本更高分」的概率", "D. AUC 取决于分类阈值的选择"],
     answer: C,
     rationale: "AUC 的概率解释是它最有用的性质，且它对阈值不敏感（D 错）。ROC 横纵轴是假正例率与真正例率（B 错）；0.5 相当于随机猜（A 错）。"}

  - {part: A, type: single, points: 2, difficulty: 0.55, kp: ML-04-10,
     stem: "在验证集上比较了 200 组超参，选出最好的一组并报告其验证集得分。这个得分的问题是？",
     options: ["A. 没有问题，验证集本来就用于选参", "B. 该得分因多次选择而偏乐观，应另用一份从未参与选择的测试集来报告", "C. 应该改用训练集得分", "D. 200 组太少，应扩大到 2000 组"],
     answer: B,
     rationale: "选择次数越多，被选中者的验证集得分越可能是运气。这就是验证集调参导致的乐观偏差，必须用独立测试集报告最终性能。"}

  - {part: A, type: single, points: 2, difficulty: 0.6, kp: ML-03-08,
     stem: "以下哪种做法构成数据泄漏（data leakage）？",
     options: ["A. 在训练集上拟合标准化参数，再用它变换验证集", "B. 在全量数据上拟合标准化参数，然后才划分训练集与验证集", "C. 对训练集做数据增强", "D. 用交叉验证选择模型"],
     answer: B,
     rationale: "先在全量数据上算均值方差，验证集的信息就通过标准化参数漏进了训练过程。正确顺序是先划分、后在训练集上拟合。"}

  - {part: A, type: judge, points: 1, difficulty: 0.3, kp: ML-01-04,
     stem: "判断：测试集可以在调参过程中多次使用，只要最后只报告一次结果。",
     options: ["A. 正确", "B. 错误"], answer: B,
     rationale: "多次使用即已污染，与报告几次无关。"}

  - {part: A, type: judge, points: 1, difficulty: 0.35, kp: ML-01-06,
     stem: "判断：训练误差为 0 的模型一定是好模型。",
     options: ["A. 正确", "B. 错误"], answer: B,
     rationale: "训练误差为 0 往往是过拟合的征兆。"}

  - {part: A, type: judge, points: 1, difficulty: 0.4, kp: ML-01-08,
     stem: "判断：存在一种在所有问题上都优于其他算法的通用机器学习算法。",
     options: ["A. 正确", "B. 错误"], answer: B,
     rationale: "NFL 定理否定了这一点。"}

  - {part: A, type: judge, points: 1, difficulty: 0.4, kp: ML-04-03,
     stem: "判断：查准率和查全率通常此消彼长，提高一个往往以降低另一个为代价。",
     options: ["A. 正确", "B. 错误"], answer: A,
     rationale: "调高阈值提升查准、降低查全，反之亦然。F1 是二者的调和平均。"}

  - {part: A, type: judge, points: 1, difficulty: 0.45, kp: ML-04-07,
     stem: "判断：留出法只做一次划分，其评估结果通常比交叉验证更稳定。",
     options: ["A. 正确", "B. 错误"], answer: B,
     rationale: "单次划分受划分方式影响大，方差更高；交叉验证通过多次划分取平均，更稳定。"}

  - {part: A, type: judge, points: 1, difficulty: 0.4, kp: ML-01-05,
     stem: "判断：泛化误差无法精确计算，只能通过在未见样本上的表现来估计。",
     options: ["A. 正确", "B. 错误"], answer: A,
     rationale: "泛化误差是对真实分布的期望，实践中只能估计。"}

  - {part: A, type: judge, points: 1, difficulty: 0.45, kp: ML-04-04,
     stem: "判断：AUC 的取值不随分类阈值改变而改变。",
     options: ["A. 正确", "B. 错误"], answer: A,
     rationale: "AUC 是对所有阈值下 ROC 曲线的积分，本身与具体阈值无关。"}

  - {part: A, type: judge, points: 1, difficulty: 0.5, kp: ML-04-08,
     stem: "判断：在类别极不平衡的数据上做交叉验证时，应使用分层抽样保持每折的类别比例。",
     options: ["A. 正确", "B. 错误"], answer: A,
     rationale: "否则某些折可能几乎没有正例，评估结果会剧烈波动。"}

  - {part: A, type: judge, points: 1, difficulty: 0.5, kp: ML-03-10,
     stem: "判断：对时间序列数据，可以随机打乱后再划分训练集与测试集。",
     options: ["A. 正确", "B. 错误"], answer: B,
     rationale: "随机打乱会让模型用未来的信息预测过去，属于典型的数据泄漏。时间序列必须按时间切分。"}

  - {part: A, type: judge, points: 1, difficulty: 0.55, kp: ML-01-07,
     stem: "判断：增加训练数据量通常能缓解高方差（过拟合），但对高偏差（欠拟合）帮助有限。",
     options: ["A. 正确", "B. 错误"], answer: A,
     rationale: "高偏差是模型本身表达能力不足，加数据不解决问题，应提高模型容量或改进特征。"}

# ---------------------------------------------------------------------
# B 部分 · 选拔专用（60 分）  单选 9×2 + 填空 10×2 + 程序阅读 4×3 + 程序题 2×5
# 考后可公开讲评。程序题人工判分，其余全部规则自动判分——
# 自动判分越多，分数线附近受判分噪声干扰越小（measurement-plan §4.1）
# ---------------------------------------------------------------------

  - {part: B, type: single, points: 2, difficulty: 0.35, kp: ML-02-01,
     stem: "张量 X 形状为 (2, 3, 4)。执行 X.reshape(-1, 4) 之后，新张量的形状是？",
     options: ["A. (2, 12)", "B. (6, 4)", "C. (24, 4)", "D. (4, 6)"],
     answer: B,
     rationale: "-1 表示由总元素数推断。总元素 2×3×4=24，末维固定为 4，故首维为 6。"}

  - {part: B, type: single, points: 2, difficulty: 0.5, kp: ML-02-01,
     stem: "形状 (3, 1) 与 (1, 4) 的两个张量相加，按广播规则结果形状是？",
     options: ["A. 报错，形状不匹配", "B. (3, 4)", "C. (1, 1)", "D. (3, 1)"],
     answer: B,
     rationale: "广播时长度为 1 的维度被拉伸到对方的长度，两个方向各拉伸一次，得到 (3, 4)。"}

  - {part: B, type: single, points: 2, difficulty: 0.45, kp: ML-03-04,
     stem: "对特征做标准化（减均值除标准差）时，均值和标准差应当在哪部分数据上计算？",
     options: ["A. 全量数据，这样统计量最准", "B. 只在训练集上计算，再用同一组统计量变换验证集与测试集", "C. 训练集与验证集分别各算各的", "D. 测试集上计算，因为要贴近线上分布"],
     answer: B,
     rationale: "在全量数据上算会把验证/测试集的信息漏进训练；各算各的会让训练与推理的变换不一致，造成训练服务偏斜。"}

  - {part: B, type: single, points: 2, difficulty: 0.45, kp: ML-03-02,
     stem: "某数值列有 30% 缺失。下列处理中，最可能引入偏差且难以察觉的是？",
     options: ["A. 用训练集该列的均值填充，并额外增加一个「是否缺失」的指示列", "B. 直接删除所有含缺失的样本行", "C. 用全量数据（含测试集）的均值填充", "D. 保留缺失，交给能处理缺失的模型"],
     answer: C,
     rationale: "用含测试集的统计量填充是数据泄漏，且它不会报错、指标还会变好看，因此最难察觉。B 会损失样本但问题是显式的。"}

  - {part: B, type: single, points: 2, difficulty: 0.4, kp: ML-02-05,
     stem: "向量 x = [3, -4] 的 L1 范数与 L2 范数分别是？",
     options: ["A. 7 与 5", "B. 5 与 7", "C. 7 与 7", "D. 1 与 5"],
     answer: A,
     rationale: "L1 = |3|+|-4| = 7；L2 = sqrt(9+16) = 5。"}

  - {part: B, type: single, points: 2, difficulty: 0.5, kp: ML-02-07,
     stem: "关于梯度，下列说法正确的是？",
     options: ["A. 梯度是标量，表示函数变化的快慢", "B. 梯度方向是函数值下降最快的方向", "C. 梯度是各偏导数组成的向量，指向函数值增长最快的方向", "D. 梯度只对线性函数有定义"],
     answer: C,
     rationale: "梯度指向上升最快方向，所以梯度下降要沿负梯度走——B 恰好把方向说反了。"}

  - {part: B, type: single, points: 2, difficulty: 0.45, kp: ML-02-11,
     stem: "已知 P(A)=0.6，P(B|A)=0.5。则 P(A 且 B) 等于？",
     options: ["A. 0.1", "B. 0.3", "C. 0.6", "D. 1.1"],
     answer: B,
     rationale: "由条件概率定义 P(A∩B) = P(A)·P(B|A) = 0.6×0.5 = 0.3。"}

  - {part: B, type: single, points: 2, difficulty: 0.5, kp: ML-04-06,
     stem: "回归任务中，相比 MAE，RMSE 的主要特点是？",
     options: ["A. 计算更快", "B. 对大误差惩罚更重，因而对离群点更敏感", "C. 取值范围一定在 0 到 1 之间", "D. 与量纲无关"],
     answer: B,
     rationale: "RMSE 先平方再开根，大误差被放大。数据含离群点时 MAE 通常更稳健。"}

  - {part: B, type: single, points: 2, difficulty: 0.55, kp: ML-03-01,
     stem: "团队用工作日 8:00–9:00 采集的视频训练拥堵识别模型，全天上线后夜间误报很多。最贴切的诊断是？",
     options: ["A. 模型容量不足，应换更深的网络", "B. 采集时段导致抽样偏差，训练分布覆盖不到夜间场景", "C. 学习率过大，训练没有收敛", "D. 测试集划分比例不对"],
     answer: B,
     rationale: "症状是某一类场景系统性出错，而非整体都差——这是分布问题不是拟合问题。换更深的网络只会把训练分布拟合得更死。"}

