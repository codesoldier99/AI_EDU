# Python语言程序设计（G18Z21021）
#
# 按需求队列建设：DAC 项目的「环境搭建与首次运行」要用虚拟环境与依赖管理（PY-VENV）——
# 新人第一道坎就卡在这里。

course:
  code: G18Z21021
  name: Python语言程序设计
  credit: 2.0
  term: "1"

units:
  - name: 第1章 语言基础
    kps:
      - PY-01-01 | 变量与基本数据类型 | concept | 0.2 | M2 |  | 能说出动态类型与静态类型的差别
      - PY-01-02 | 运算符与表达式 | skill | 0.2 | M2 | PY-01-01 | 能正确使用整除、取模与比较运算
      - PY-01-03 | 条件与循环 | skill | 0.3 | M2 | PY-01-02 | 能用循环与分支写出一个完整的处理流程
      - PY-01-04 | 函数定义与参数传递 | skill | 0.4 | M2 | PY-01-03 | 能区分位置参数、关键字参数与默认值陷阱
      - PY-01-05 | 作用域与闭包 | concept | 0.6 | M2 | PY-01-04 | 能解释函数内为何改不了外层变量

  - name: 第2章 内置容器
    kps:
      - PY-02-01 | 列表与切片 | skill | 0.3 | M2 | PY-01-01 | 能用切片取出子序列并理解其为浅拷贝
      - PY-02-02 | 元组与不可变性 | concept | 0.4 | M2 | PY-02-01 | 能说明不可变对象为何能作字典键
      - PY-02-03 | 字典与集合 | skill | 0.4 | M2,M3 | PY-02-02 | 能用字典做计数与索引
      - PY-02-04 | 推导式 | skill | 0.4 | M2 | PY-02-03 | 能把一个循环改写成列表或字典推导式
      - PY-02-05 | 迭代器与生成器 | concept | 0.6 | M2,M3 | PY-02-04 | 能用生成器处理放不进内存的数据

  - name: 第3章 模块与工程环境
    kps:
      - PY-03-01 | 模块与包 | concept | 0.4 | M2,M7 | PY-01-04 | 能把代码拆成模块并正确导入
      - PY-VENV | 虚拟环境与依赖管理 | skill | 0.4 | M2,M7 | PY-03-01 | 能建立隔离环境并用依赖清单复现它
      - PY-03-03 | 标准库常用模块 | skill | 0.4 | M2 | PY-03-01 | 能用标准库完成路径、时间与 JSON 处理
      - PY-03-04 | 文件读写与编码 | skill | 0.4 | M2 | PY-03-03 | 能正确处理中文编码不踩乱码
      - PY-03-05 | 异常处理 | method | 0.5 | M2,M7 | PY-01-03 | 能只捕获自己能处理的异常

  - name: 第4章 面向对象与常用范式
    kps:
      - PY-04-01 | 类的定义与使用 | skill | 0.4 | M2 | PY-01-04 | 能定义一个带初始化与方法的类
      - PY-04-02 | 特殊方法 | concept | 0.6 | M2 | PY-04-01 | 能让自定义对象支持打印与比较
      - PY-04-03 | 装饰器 | method | 0.7 | M2 | PY-01-05,PY-04-01 | 能写一个记录耗时的装饰器

  - name: 第5章 科学计算与工程规范
    kps:
      - PY-05-01 | 数组计算基础 | skill | 0.5 | M2,M4 | PY-02-01,ML-02-01 | 能用向量化运算替代显式循环
      - PY-05-02 | 数据可视化基础 | skill | 0.4 | M2,M8 | PY-05-01 | 能画出一条带坐标轴标注的曲线
      - PY-05-03 | 代码风格与静态检查 | skill | 0.3 | M2,M7 | PY-03-01 | 能让代码通过风格检查工具
      - PY-05-04 | 单元测试入门 | skill | 0.5 | M7 | PY-03-05,PY-01-04 | 能为一个函数写出覆盖边界的测试
