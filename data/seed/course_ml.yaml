# 试点课程知识图谱 —— 机器学习原理与应用
#
# 标注规范见 docs/kp-annotation.md：
#   粒度准则：能独立命题、能独立判定会不会
#   依赖边只标强依赖（"学 B 前必须先会 A"），弱相关用 related
#   每个知识点挂 1–3 个能力模块（M1–M8）
#
# 行格式（用 | 分隔，便于教师直接在表格里维护）：
#   代码 | 名称 | 类型 | 难度 | 能力模块 | 前置知识点(逗号分隔) | 一句话说明
# 类型 ∈ concept/method/skill/tool

course:
  code: ML
  name: 机器学习原理与应用
  credit: 4.0
  term: "3"

modules:
  - [M1, 数学与建模基础, 用数学语言刻画问题并推导结论的能力]
  - [M2, 编程与工程实现, 把算法写成可运行、可维护代码的能力]
  - [M3, 算法设计与分析, 选择、改造与分析算法复杂度的能力]
  - [M4, 数据处理与特征工程, 获取、清洗、构造特征并评估数据质量的能力]
  - [M5, 模型训练与调优, 训练、诊断与改进模型表现的能力]
  - [M6, 系统集成与部署, 把模型接入真实系统并稳定运行的能力]
  - [M7, 工程质量与协作, 测试、评审、版本与团队协作的能力]
  - [M8, 技术表达与伦理素养, 书面表达、答辩以及数据安全与AI伦理判断力]

units:
  - name: 第1章 绪论与学习范式
    kps:
      - ML-01-01 | 机器学习的定义与三要素 | concept | 0.2 | M1 |  | 能说出"模型-策略-算法"三要素并对号入座
      - ML-01-02 | 监督学习与无监督学习的分野 | concept | 0.2 | M1 | ML-01-01 | 能依据是否有标注判定任务类型
      - ML-01-03 | 分类与回归任务的判别 | concept | 0.2 | M1 | ML-01-02 | 能依据输出空间判定任务并选对评价指标族
      - ML-01-04 | 训练集/验证集/测试集的角色 | concept | 0.3 | M4,M5 | ML-01-01 | 能说出三者不可混用的原因
      - ML-01-05 | 泛化误差与经验误差 | concept | 0.4 | M1,M5 | ML-01-04 | 能区分两者并解释为何经验误差不可信
      - ML-01-06 | 过拟合与欠拟合的识别 | concept | 0.4 | M5 | ML-01-05 | 能由训练/验证曲线判定所处状态
      - ML-01-07 | 偏差-方差分解 | concept | 0.6 | M1,M5 | ML-01-05 | 能推导分解式并解释调参方向
      - ML-01-08 | 归纳偏好与没有免费的午餐定理 | concept | 0.5 | M1 | ML-01-05 | 能解释为何不存在普适最优算法
      - ML-01-09 | 强化学习与自监督学习概览 | concept | 0.3 | M1 | ML-01-02 | 能说出与监督学习在信号来源上的差异
      - ML-01-10 | 机器学习项目的完整流程 | skill | 0.3 | M4,M6 | ML-01-04 | 能画出从问题定义到上线监控的流程图
      - ML-01-11 | 国产机器学习框架生态与自主可控 | concept | 0.2 | M8,M6 | ML-01-10 | 能说出飞桨/昇思的定位与自主可控的意义
      - ML-01-12 | 机器学习不适用的场景判别 | skill | 0.5 | M1,M8 | ML-01-08 | 能判断何时应当用规则而非学习

  - name: 第2章 数学基础
    kps:
      - ML-02-01 | 向量与矩阵运算 | method | 0.3 | M1 |  | 能手算矩阵乘法与转置并判断维度合法性
      - ML-02-02 | 矩阵的秩与可逆性 | concept | 0.5 | M1 | ML-02-01 | 能由秩判断线性方程组解的情况
      - ML-02-03 | 特征值与特征向量 | method | 0.6 | M1 | ML-02-02 | 能求解小矩阵特征值并解释几何含义
      - ML-02-04 | 奇异值分解SVD | method | 0.7 | M1,M3 | ML-02-03 | 能说明 SVD 与 PCA 的关系
      - ML-02-05 | 范数与距离度量 | concept | 0.3 | M1 | ML-02-01 | 能区分 L1/L2/无穷范数及其几何形状
      - ML-02-06 | 导数与偏导数 | method | 0.3 | M1 |  | 能对多元函数求偏导
      - ML-02-07 | 梯度与方向导数 | concept | 0.4 | M1 | ML-02-06 | 能解释梯度为最速上升方向
      - ML-02-08 | 链式法则 | method | 0.4 | M1 | ML-02-06 | 能对复合函数逐层求导——反向传播的根
      - ML-02-09 | 凸函数与凸优化基础 | concept | 0.6 | M1,M3 | ML-02-07 | 能判定函数凸性并说明凸性带来的保证
      - ML-02-10 | 拉格朗日乘子法与对偶 | method | 0.7 | M1,M3 | ML-02-09 | 能写出约束优化的对偶问题
      - ML-02-11 | 概率、条件概率与独立性 | concept | 0.3 | M1 |  | 能正确使用乘法公式与独立性假设
      - ML-02-12 | 贝叶斯公式 | method | 0.4 | M1 | ML-02-11 | 能由先验与似然算后验
      - ML-02-13 | 期望、方差与协方差 | concept | 0.4 | M1 | ML-02-11 | 能计算并解释协方差矩阵
      - ML-02-14 | 常见分布与最大似然估计 | method | 0.5 | M1 | ML-02-12 | 能写出似然函数并求解 MLE
      - ML-02-15 | 信息熵与KL散度 | concept | 0.6 | M1 | ML-02-14 | 能解释交叉熵损失的信息论来源

  - name: 第3章 数据与特征工程
    kps:
      - ML-03-01 | 数据采集与抽样偏差 | concept | 0.4 | M4,M8 | ML-01-04 | 能识别样本不代表总体的常见来源
      - ML-03-02 | 缺失值的机制与处理 | method | 0.4 | M4 | ML-03-01 | 能区分 MCAR/MAR/MNAR 并选择填补策略
      - ML-03-03 | 异常值检测与处理 | method | 0.5 | M4 | ML-02-13 | 能用统计与模型两类方法识别异常
      - ML-03-04 | 特征缩放与标准化 | method | 0.3 | M4,M5 | ML-02-05 | 能说明哪些模型对量纲敏感
      - ML-03-05 | 类别特征编码 | method | 0.3 | M4 | ML-03-04 | 能选择 one-hot/目标编码并说明风险
      - ML-03-06 | 特征构造与业务先验 | skill | 0.5 | M4 | ML-03-05 | 能从业务含义出发构造有效交互特征
      - ML-03-07 | 特征选择的三类方法 | method | 0.5 | M4,M3 | ML-03-06 | 能区分过滤/包裹/嵌入式方法
      - ML-03-08 | 数据泄漏的识别与防范 | concept | 0.7 | M4,M5 | ML-01-04 | 能识别时间穿越与标签泄漏——最常见的致命错误
      - ML-03-09 | 类别不平衡的处理 | method | 0.5 | M4,M5 | ML-03-05 | 能选择重采样/代价敏感/阈值调整
      - ML-03-10 | 数据集划分与时间序列切分 | method | 0.5 | M4 | ML-03-08 | 能对时序数据做无泄漏切分
      - ML-03-11 | 数据版本管理与可复现 | skill | 0.4 | M4,M7 | ML-03-10 | 能固定随机种子与数据版本使实验可复现
      - ML-03-12 | 标注质量与一致性检验 | skill | 0.5 | M4,M7 | ML-03-01 | 能用一致性系数评估多人标注质量
      - ML-03-13 | 数据合规与隐私保护 | concept | 0.4 | M8 | ML-03-01 | 能说出个人信息保护法对训练数据的约束
      - ML-03-14 | 数据管道的工程实现 | skill | 0.5 | M2,M6 | ML-03-11 | 能写出可重复执行的数据处理脚本

  - name: 第4章 模型评估与选择
    kps:
      - ML-04-01 | 混淆矩阵 | concept | 0.3 | M5 | ML-01-03 | 能由混淆矩阵读出四类计数
      - ML-04-02 | 准确率的局限 | concept | 0.4 | M5 | ML-04-01 | 能说明不平衡数据下准确率为何失效
      - ML-04-03 | 精确率、召回率与F1 | method | 0.4 | M5 | ML-04-01 | 能计算并解释三者的取舍
      - ML-04-04 | ROC曲线与AUC | method | 0.6 | M5 | ML-04-03 | 能解释 AUC 的排序含义
      - ML-04-05 | PR曲线及其适用场景 | method | 0.6 | M5 | ML-04-04 | 能说明正例稀少时为何优先看 PR
      - ML-04-06 | 回归任务的评价指标 | method | 0.3 | M5 | ML-01-03 | 能区分 MAE/MSE/R² 的敏感性差异
      - ML-04-07 | 留出法与交叉验证 | method | 0.4 | M5 | ML-01-04 | 能实现 k 折并说明其方差来源
      - ML-04-08 | 分层抽样与分组交叉验证 | method | 0.5 | M5 | ML-04-07 | 能在分组数据上避免同组穿越
      - ML-04-09 | 超参数搜索策略 | method | 0.5 | M5,M3 | ML-04-07 | 能比较网格/随机/贝叶斯搜索的代价
      - ML-04-10 | 验证集调参导致的乐观偏差 | concept | 0.7 | M5 | ML-04-09 | 能解释嵌套交叉验证为何必要
      - ML-04-11 | 统计显著性与模型比较 | method | 0.7 | M1,M5 | ML-04-07 | 能用配对检验判断差异是否真实
      - ML-04-12 | 学习曲线诊断 | skill | 0.5 | M5 | ML-01-06 | 能由学习曲线判断该加数据还是加模型容量
      - ML-04-13 | 校准与概率输出可信度 | concept | 0.7 | M5 | ML-04-04 | 能用可靠性图判断概率是否可信
      - ML-04-14 | 离线指标与线上指标的落差 | concept | 0.6 | M5,M6 | ML-04-12 | 能列出造成落差的常见原因

  - name: 第5章 线性模型
    kps:
      - ML-05-01 | 线性回归模型形式 | concept | 0.3 | M1,M5 | ML-02-01 | 能写出矩阵形式并说明各项含义
      - ML-05-02 | 最小二乘法与正规方程 | method | 0.5 | M1 | ML-05-01,ML-02-02 | 能推导闭式解并说明可逆性条件
      - ML-05-03 | 梯度下降求解线性回归 | method | 0.4 | M1,M2 | ML-05-01,ML-02-07 | 能手写梯度下降迭代
      - ML-05-04 | 多重共线性 | concept | 0.6 | M1,M4 | ML-05-02 | 能识别共线性并说明其对系数的影响
      - ML-05-05 | 岭回归与L2正则 | method | 0.5 | M5 | ML-05-04,ML-02-05 | 能解释 L2 为何缓解共线性
      - ML-05-06 | Lasso与L1稀疏性 | method | 0.6 | M5 | ML-05-05 | 能解释 L1 产生稀疏解的几何原因
      - ML-05-07 | 逻辑回归与sigmoid | concept | 0.4 | M1,M5 | ML-05-01,ML-02-11 | 能说明为何用对数几率而非直接回归
      - ML-05-08 | 交叉熵损失的推导 | method | 0.6 | M1 | ML-05-07,ML-02-15 | 能由极大似然推出交叉熵
      - ML-05-09 | 逻辑回归的梯度推导 | method | 0.6 | M1 | ML-05-08,ML-02-08 | 能完整推出参数梯度
      - ML-05-10 | 多分类softmax | method | 0.5 | M5 | ML-05-08 | 能写出 softmax 与其数值稳定实现
      - ML-05-11 | 决策边界与线性可分性 | concept | 0.5 | M1 | ML-05-07 | 能画出决策边界并判断线性可分性
      - ML-05-12 | 广义线性模型视角 | concept | 0.7 | M1 | ML-05-10 | 能用连接函数统一看待回归族
      - ML-05-13 | 线性模型的可解释性 | skill | 0.4 | M8,M5 | ML-05-06 | 能正确解读系数并说明其前提
      - ML-05-14 | 用国产框架实现线性模型 | skill | 0.4 | M2,M6 | ML-05-03,ML-01-11 | 能在飞桨/PyTorch 上实现并验证

  - name: 第6章 决策树与集成学习
    kps:
      - ML-06-01 | 决策树的基本结构 | concept | 0.3 | M3 | ML-01-03 | 能读懂并手工模拟一棵树的预测
      - ML-06-02 | 信息增益与ID3 | method | 0.5 | M1,M3 | ML-06-01,ML-02-15 | 能计算信息增益并选择划分属性
      - ML-06-03 | 增益率与C4.5 | method | 0.5 | M3 | ML-06-02 | 能说明增益率修正了什么偏好
      - ML-06-04 | 基尼指数与CART | method | 0.5 | M3 | ML-06-02 | 能计算基尼指数并构造二叉划分
      - ML-06-05 | 连续值与缺失值的处理 | method | 0.6 | M3,M4 | ML-06-04,ML-03-02 | 能实现连续属性的最优切点搜索
      - ML-06-06 | 剪枝：预剪枝与后剪枝 | method | 0.6 | M3,M5 | ML-06-04,ML-01-06 | 能说明剪枝如何抑制过拟合
      - ML-06-07 | Bagging与自助采样 | method | 0.5 | M3,M5 | ML-06-01,ML-01-07 | 能解释 Bagging 主要降低方差
      - ML-06-08 | 随机森林 | method | 0.5 | M3,M5 | ML-06-07 | 能说明特征扰动带来的额外收益
      - ML-06-09 | 袋外估计OOB | method | 0.5 | M5 | ML-06-07 | 能用 OOB 代替部分交叉验证
      - ML-06-10 | Boosting与AdaBoost | method | 0.7 | M3 | ML-06-07 | 能说明样本权重的更新逻辑
      - ML-06-11 | 梯度提升树GBDT | method | 0.8 | M3,M5 | ML-06-10,ML-02-07 | 能解释残差拟合与梯度的关系
      - ML-06-12 | XGBoost与LightGBM的工程改进 | concept | 0.7 | M3,M6 | ML-06-11 | 能说出直方图与叶子生长策略的取舍
      - ML-06-13 | 特征重要性及其误读 | skill | 0.6 | M5,M8 | ML-06-08 | 能说明分裂次数型重要性的偏差
      - ML-06-14 | 树模型与线性模型的选型 | skill | 0.5 | M3,M5 | ML-06-12,ML-05-13 | 能依据数据形态给出选型理由

  - name: 第7章 支持向量机与核方法
    kps:
      - ML-07-01 | 最大间隔思想 | concept | 0.6 | M1 | ML-05-11 | 能解释间隔最大化的泛化直觉
      - ML-07-02 | 硬间隔SVM的优化形式 | method | 0.7 | M1,M3 | ML-07-01,ML-02-09 | 能写出原始优化问题
      - ML-07-03 | 对偶问题与KKT条件 | method | 0.8 | M1 | ML-07-02,ML-02-10 | 能推导对偶形式并解释支持向量
      - ML-07-04 | 软间隔与松弛变量 | method | 0.7 | M1,M5 | ML-07-02 | 能说明 C 的取值含义
      - ML-07-05 | 合页损失 | concept | 0.6 | M1 | ML-07-04 | 能画出合页损失并与交叉熵对比
      - ML-07-06 | 核技巧的原理 | concept | 0.8 | M1,M3 | ML-07-03 | 能解释为何无需显式升维
      - ML-07-07 | 常用核函数与选择 | method | 0.6 | M5 | ML-07-06 | 能依据数据选择线性/RBF 核
      - ML-07-08 | SVM超参数的敏感性 | skill | 0.6 | M5 | ML-07-07,ML-04-09 | 能对 C 与 gamma 做合理搜索
      - ML-07-09 | SVM的多分类扩展 | method | 0.5 | M3 | ML-07-04 | 能区分一对一与一对多策略
      - ML-07-10 | 支持向量回归SVR | method | 0.7 | M3 | ML-07-04,ML-05-01 | 能说明 ε-不敏感损失的作用
      - ML-07-11 | 核方法的计算复杂度 | concept | 0.7 | M3 | ML-07-06 | 能说明样本量大时核方法的瓶颈
      - ML-07-12 | SVM与深度模型的适用边界 | skill | 0.5 | M5 | ML-07-11 | 能依据样本规模给出选型

  - name: 第8章 概率模型
    kps:
      - ML-08-01 | 生成式与判别式模型 | concept | 0.5 | M1 | ML-02-12 | 能说明两者建模对象的差别
      - ML-08-02 | 朴素贝叶斯分类器 | method | 0.4 | M1,M3 | ML-08-01 | 能手算一次朴素贝叶斯预测
      - ML-08-03 | 条件独立假设的代价 | concept | 0.5 | M1 | ML-08-02 | 能举例说明假设被违反时的后果
      - ML-08-04 | 拉普拉斯平滑 | method | 0.4 | M1 | ML-08-02 | 能解释零概率问题及其修正
