      - ML-08-06 | 最大后验估计MAP | method | 0.6 | M1 | ML-02-14,ML-02-12 | 能说明 MAP 与正则化的等价关系
      - ML-08-07 | EM算法的思想 | method | 0.8 | M1,M3 | ML-02-14 | 能说明 E 步与 M 步各做什么
      - ML-08-08 | 高斯混合模型 | method | 0.8 | M1,M3 | ML-08-07,ML-08-05 | 能用 GMM 做软聚类
      - ML-08-09 | 隐马尔可夫模型概览 | concept | 0.7 | M1 | ML-08-07 | 能说出三个基本问题
      - ML-08-10 | 概率图模型的表示 | concept | 0.7 | M1 | ML-08-01 | 能由图读出条件独立关系
      - ML-08-11 | 贝叶斯网络的推断代价 | concept | 0.8 | M1,M3 | ML-08-10 | 能说明精确推断为何困难
      - ML-08-12 | 概率模型的可解释优势 | skill | 0.5 | M8 | ML-08-02 | 能向非技术人员解释预测依据

  - name: 第9章 无监督学习
    kps:
      - ML-09-01 | 聚类任务的定义与评价难点 | concept | 0.4 | M3 | ML-01-02 | 能说明无标注下评价为何困难
      - ML-09-02 | K均值算法 | method | 0.4 | M3,M2 | ML-09-01,ML-02-05 | 能手工执行两轮 K-means 迭代
      - ML-09-03 | K均值的初始化敏感性 | concept | 0.5 | M3 | ML-09-02 | 能说明 K-means++ 解决了什么
      - ML-09-04 | 簇数选择：肘部法与轮廓系数 | method | 0.5 | M5 | ML-09-02 | 能计算轮廓系数并解读
      - ML-09-05 | 层次聚类 | method | 0.5 | M3 | ML-09-01 | 能读懂树状图并选择切分高度
      - ML-09-06 | 密度聚类DBSCAN | method | 0.6 | M3 | ML-09-01 | 能说明其对任意形状簇的优势
      - ML-09-07 | 距离度量对聚类结果的影响 | concept | 0.5 | M1,M4 | ML-09-02,ML-02-05 | 能解释量纲与度量选择的后果
      - ML-09-08 | 维度灾难 | concept | 0.6 | M1 | ML-02-05 | 能说明高维空间距离趋同的现象
      - ML-09-09 | 主成分分析PCA | method | 0.6 | M1,M4 | ML-09-08,ML-02-04 | 能推导 PCA 与协方差矩阵的关系
      - ML-09-10 | PCA的适用前提与误用 | concept | 0.6 | M4 | ML-09-09 | 能说明为何 PCA 前必须标准化
